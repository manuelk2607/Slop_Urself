name = "slopurself-worlds-pilot"
main = "../src/server/cloudflare/worker.ts"
compatibility_date = "2026-10-03"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "SERVICES"
class_name = "ServiceDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject", "ServiceDurableObject"]

[triggers]
crons = ["17 * * * *"]

[vars]
AI_PROVIDER = "mock"
AI_ROUND_LIMIT = "2"
WORLDS_PILOT_DEPLOYMENT = "true"
WORLDS_PILOT_ENABLED = "false"
WORLDS_PILOT_ORIGIN = "https://slopurself-worlds-pilot.maki26.workers.dev"
WORLDS_REAUTH_ENABLED = "false"
