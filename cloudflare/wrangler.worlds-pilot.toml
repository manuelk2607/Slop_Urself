name = "slopurself-worlds-pilot"
main = "../src/server/cloudflare/worker.ts"
compatibility_date = "2026-10-03"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "SERVICES"
class_name = "ServiceDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject", "ServiceDurableObject"]

[triggers]
crons = ["17 * * * *"]

[vars]
AI_PROVIDER = "mock"
AI_ROUND_LIMIT = "2"
WORLDS_PILOT_DEPLOYMENT = "true"
WORLDS_PILOT_ENABLED = "true"
WORLDS_PILOT_ORIGIN = "https://slopurself-worlds-pilot.maki26.workers.dev"
WORLDS_PILOT_DATABASE_HOST = "ep-muddy-dawn-b1fl6foa-pooler.c-5.eu-central-1.aws.neon.tech"
WORLDS_ISSUER = "https://ep-bold-boat-batl101c.neonauth.c-8.eu-central-1.aws.neon.tech/worlds_identity/auth"
WORLDS_CLIENT_ID = "xHmQeQbWdDlBfOasyyBysjtNwInTdpuG"
WORLDS_RESOURCE = "https://slopurself-worlds-pilot.maki26.workers.dev/api"
WORLDS_REAUTH_ENABLED = "true"
