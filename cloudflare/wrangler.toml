name = "slopurself"
main = "../src/server/cloudflare/worker.ts"
compatibility_date = "2026-10-03"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/ws/*", "/socket.io/*", "/.well-known/oauth-cimd"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "SERVICES"
class_name = "ServiceDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ServiceDurableObject"]

[vars]
AI_PROVIDER = "wan22"
AI_PROVIDER_CHAIN = "wan22,wan22-fast"
AI_IMAGE_PROFILE = "bounded"
AI_ROUND_LIMIT = "5"
AI_GPU_SECONDS_PER_ROUND = "0"
VIDEO_BUCKET = "slopurself-videos"
VIDEO_ARCHIVE_MB = "512"
AWS_REGION = "eu-central-1"
AWS_ENDPOINT_URL_S3 = "https://br-soft-math-b1efy5s0.storage.c-5.eu-central-1.aws.neon.tech"
LTX_DURATION = "5"

# Upload the ignored .env.local secrets with npm run cf:secrets.
