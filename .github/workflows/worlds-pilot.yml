name: Deploy isolated Worlds pilot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Pilot operation
        type: choice
        options: [deploy, inspect-rollback, exercise-rollback]
        default: deploy
      rollback_version:
        description: Explicit compatible candidate UUID for rollback exercise
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: slopurself-worlds-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'manuelk2607/Slop_Urself' && github.ref == 'refs/heads/feature/worlds-hub-sso' && (inputs.operation == 'deploy' || inputs.operation == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: worlds-pilot
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ec3c070d8e4f88d2fc533d7d797f2daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require successful Chromium and WebKit CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checked=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq 'any(.[]; .status == "completed" and .conclusion == "success")')
          test "$checked" = true || { echo 'The complete test workflow must pass for this commit first.'; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Deploy only slopurself-worlds-pilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config cloudflare/wrangler.worlds-pilot.toml --name slopurself-worlds-pilot
      - name: Configure secrets only for the isolated pilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_COOKIE_SECRET: ${{ secrets.AUTH_COOKIE_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          const {DATABASE_URL,AUTH_COOKIE_SECRET}=process.env;
          assert.equal(new URL(DATABASE_URL).hostname,'ep-muddy-dawn-b1fl6foa-pooler.c-5.eu-central-1.aws.neon.tech');
          assert.ok(AUTH_COOKIE_SECRET?.length>=32);
          const result=spawnSync('npx',['wrangler','secret','bulk','--config','cloudflare/wrangler.worlds-pilot.toml','--name','slopurself-worlds-pilot'],
            {input:JSON.stringify({DATABASE_URL,AUTH_COOKIE_SECRET}),encoding:'utf8'});
          if(result.status!==0)throw new Error('Pilot secret configuration failed');
          console.log('Configured the isolated pilot secrets');
          JS
      - name: Verify private pilot and indexing guard
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='https://slopurself-worlds-pilot.maki26.workers.dev';
          const robots=await fetch(origin+'/robots.txt');
          assert.equal(robots.status,200);
          assert.match(await robots.text(),/Disallow: \//);
          assert.match(robots.headers.get('x-robots-tag')??'',/noindex/);
          // A newly deployed secret can reach edge locations after the deploy API returns.
          let response;
          for(let attempt=0;attempt<12;attempt++){
            response=await fetch(origin+'/');
            if(response.status!==503)break;
            await response.body?.cancel();
            if(attempt<11)await new Promise(resolve=>setTimeout(resolve,3000));
          }
          assert.equal(response.status,200);
          assert.equal(response.headers.get('cache-control'),'no-store');
          assert.match(response.headers.get('x-robots-tag')??'',/noindex/);
          console.log('PASS isolated pilot target and private response headers');
          JS

  rollback:
    if: github.repository == 'manuelk2607/Slop_Urself' && github.ref == 'refs/heads/feature/worlds-hub-sso' && (inputs.operation == 'inspect-rollback' || inputs.operation == 'exercise-rollback')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: worlds-pilot
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require successful complete CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checked=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq 'any(.[]; .status == "completed" and .conclusion == "success")')
          test "$checked" = true || { echo 'Complete CI must pass for this commit first.'; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Inspect the fixed pilot only
        if: inputs.operation == 'inspect-rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --import tsx tools/worlds-pilot-rollback.mts inspect
      - name: Exercise compatible version and restore original
        if: inputs.operation == 'exercise-rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: node --import tsx tools/worlds-pilot-rollback.mts exercise
