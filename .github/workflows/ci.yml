name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: moderation-service/package-lock.json
      - name: Install moderation test dependencies
        working-directory: moderation-service
        run: npm ci
      - name: Moderation technical regressions (no model downloads or inference)
        working-directory: moderation-service
        run: |
          npm run build
          npm test
      - name: Controlled Wan contract regressions (stdlib only, no GPU)
        run: python3 -m unittest discover -s wan-service -p 'test_*.py'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned adapter CPU dependencies (no torch or models)
        run: python -m pip install --require-hashes -r wan-service/requirements-adapter-cpu.txt
      - name: Real Gradio HTTP, private media and one-shot contract tests
        run: python -m unittest discover -s wan-service -p 'test_*.py'
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Isolated PostgreSQL 17 regressions
        run: |
          node --import tsx tests/integration/features-db.mts
          npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-local-test-only@127.0.0.1:5432/postgres
          DATABASE_URL: postgresql://postgres:ci-local-test-only@127.0.0.1:5432/postgres
          DATABASE_URL_UNPOOLED: postgresql://postgres:ci-local-test-only@127.0.0.1:5432/postgres
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:ci
        env:
          TEST_ARTIFACT_DIR: /tmp
          TEST_BROWSER_ENGINE: ${{ matrix.browser }}
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.browser }}
          path: |
            /tmp/slopurself-*failed*.png
          if-no-files-found: ignore
